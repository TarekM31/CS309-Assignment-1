<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about me</title>
    <link rel="stylesheet" href="css/Stylesheet.css">
</head>
<body id="top">
    <header>
        <h1>About me</h1>
        <nav aria-label="main navigation">
            <a href="index.html">Home</a>
            <a href="about.html" aria-current="page">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="layout">
        <section class="item">
            <h2>I am tarek</h2>
        </section>

        <section class="item">
            <h3>My Skills</h3>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
            </ul>
        </section>

        <section class="item">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Course</th>
                        <th scope="col">Day</th>
                        <th scope="col">Room</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Web Basics</td>
                        <td>Monday</td>
                        <td>B12</td>
                    </tr>
                    <tr>
                        <td>DataBases</td>
                        <td>Tuesday</td>
                        <td>C03</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="item">
            <form action="#" method="get">
                <label for="name">name</label>
                <input type="text" id="name" name="name">

                <label for="email">email</label>
                <input type="email" id="email" name="email">

                <label for="course">course</label>
                <select id="course" name="course">
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                </select>

                <button type="submit">send</button>
            </form>
        </section>

        <section class="item">
            <p class="alert" role="status">notification</p>
        </section>

        <section class="item">
            <a class="button" href="#modal">open modal</a>
        </section>
    </main>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <a class="modal-background" href="#top" aria-label="close modal"></a>
        <div class="modal-content">
            <h2 id="modal-title">modal</h2>
            <a class="button" href="#top">close</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 tarek</p>
    </footer>
</body>
</html>
