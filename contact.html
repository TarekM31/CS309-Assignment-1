<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/Stylesheet.css">
</head>
<body>
    <header>
        <h1>Contact</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h2>contact me</h2>
        <form>
            <label for="Email">Email:</label>
            <input type="email" id="Email" name="Email">
            <label for="Name">Name:</label>
            <input type="text" id="Name" name="Name">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age">
            <label for="date">Preferred contact date:</label>
            <input type="date" id="date" name="date">
            <p>Preferred contact method:</p>
            <input type="radio" id="contact-email" name="contact" value="email">
            <label for="contact-email">email</label>
            <input type="radio" id="contact-phone" name="contact" value="phone">
            <label for="contact-phone">phone</label>
            <p>contact topic:</p>
            <input type="checkbox" id="feedback" name="feedback" value="feedback">
            <label for="feedback">Feedback</label>
            <input type="checkbox" name="question" id="question" value="question">
             <label for="question">Question</label>
            <p></p>
            <label for="course">Course question:</label>
            <select id="course" name="course">
                <option value="CS309">CS309</option>
                <option value="CS305">CS305</option>
                <option value="CS307">CS307</option>
            </select>
            <label for="Message">Message</label>
            <textarea name="Message" id="Message" rows="4" cols="30"></textarea>
        </form>
    

    </main>
    <footer>
        <P>&copy; 2026 tarek</P>
    </footer>
    
</body>
</html>
